<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ajit ❤️ Puja</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border-radius: 25px;
      padding: 40px;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      z-index: 2;
      animation: fadeIn 1.2s ease;
    }

    h1 {
      font-size: 2.6em;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.3em;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    button {
      padding: 14px 32px;
      font-size: 1.1em;
      margin: 8px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #ff3366, #ff6699);
      color: #fff;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }

    button:hover {
      transform: scale(1.1);
      box-shadow: 0 12px 25px rgba(0,0,0,0.35);
    }

    .hidden {
      display: none;
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      font-size: 20px;
      animation: floatUp 6s linear infinite;
      opacity: 0.8;
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh);
        opacity: 1;
      }
      to {
        transform: translateY(-10vh);
        opacity: 0;
      }
    }

    /* Fireworks */
    .firework {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      animation: explode 1s ease-out forwards;
    }

    @keyframes explode {
      from { transform: scale(1); opacity: 1; }
      to { transform: scale(18); opacity: 0; }
    }

    #celebrationText {
      font-size: 2em;
      margin-top: 20px;
      animation: pulse 0.7s infinite alternate;
    }

    #punchEmoji {
      font-size: 6em;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      animation: punchAnim 0.5s forwards;
      z-index: 10;
    }

    @keyframes punchAnim {
      0% { transform: translate(-50%, -50%) scale(0); }
      50% { transform: translate(-50%, -50%) scale(1.3); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.06); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<!-- Romantic sound -->
<audio id="clickSound">
  <source src="https://assets.mixkit.co/sfx/preview/mixkit-romantic-tone-1276.mp3" type="audio/mpeg">
</audio>

<div class="card" id="intro">
  <h1>Happy Valentine’s Day Budu ❤️</h1>
  <p>Every love story is beautiful,<br>but ours is my favorite.</p>
  <button onclick="showProposal()">Open my heart 💖</button>
</div>

<div class="card hidden" id="proposal">
  <h1>Ajit ❤️ Puja</h1>
  <p>
    From sunrise to sunset,<br>
    from dreams to forever…<br><br>
    <strong>Puja chooses Ajit.</strong><br>
    Today. Tomorrow. Always.
  </p>

  <h1>Will you be my Valentine forever? 💍</h1>

  <button onclick="yesClicked()">YES 😭❤️</button>
  <button onclick="noClicked()">NO 🙈</button>

  <div id="celebrationText" class="hidden">
    Yayyyy, thank you for choosing me 💖🎆
  </div>

  <div id="punchEmoji" class="hidden">
    👊
  </div>
</div>

<script>
  const sound = document.getElementById("clickSound");

  function playSound() {
    sound.currentTime = 0;
    sound.play();
  }

  function showProposal() {
    playSound();
    document.getElementById("intro").classList.add("hidden");
    document.getElementById("proposal").classList.remove("hidden");
  }

  function yesClicked() {
    playSound();
    document.getElementById("punchEmoji").classList.add("hidden");
    document.getElementById("celebrationText").classList.remove("hidden");

    for (let i = 0; i < 30; i++) {
      setTimeout(createFirework, i * 120);
    }
  }

  function noClicked() {
    playSound();
    document.getElementById("celebrationText").classList.add("hidden");
    const punch = document.getElementById("punchEmoji");
    punch.classList.remove("hidden");
    // Restart animation
    punch.style.animation = "none";
    punch.offsetHeight; // trigger reflow
    punch.style.animation = "punchAnim 0.5s forwards";
  }

  function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random() * 3) + "s";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 6000);
  }

  function createFirework() {
    const firework = document.createElement("div");
    firework.className = "firework";
    firework.style.left = Math.random() * 100 + "vw";
    firework.style.top = Math.random() * 60 + "vh";
    firework.style.background =
      `hsl(${Math.random() * 360}, 100%, 70%)`;
    document.body.appendChild(firework);

    setTimeout(() => firework.remove(), 1000);
  }

  setInterval(createHeart, 300);
</script>

</body>
</html>
