<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Forever ❤️</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      text-align: center;
      color: #fff;
    }

    .container {
      position: relative;
      top: 50%;
      transform: translateY(-50%);
      padding: 20px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.5em;
      margin-bottom: 30px;
    }

    button {
      padding: 15px 35px;
      font-size: 1.2em;
      background: #e6005c;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.1);
    }

    .hidden {
      display: none;
    }

    .heart {
      position: absolute;
      color: rgba(255, 255, 255, 0.8);
      font-size: 20px;
      animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh);
        opacity: 1;
      }
      to {
        transform: translateY(-10vh);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

<div class="container" id="intro">
  <h1>Happy Valentine’s Day Budu ❤️</h1>
  <p>Every love story is beautiful… but ours is my favorite.</p>
  <button onclick="showProposal()">Click here 💖</button>
</div>

<div class="container hidden" id="proposal">
  <h1>My Love 💍</h1>
  <p>
    From Sunrise to Sunset,<br>
    From Dreams to Forever…<br><br>
    I choose you. Always.
  </p>
  <h1>Will you be my Valentine… forever? ❤️</h1>
  <button onclick="sayYes()">YES 😭❤️</button>
</div>

<script>
  function showProposal() {
    document.getElementById("intro").classList.add("hidden");
    document.getElementById("proposal").classList.remove("hidden");
  }

  function sayYes() {
    alert("He said YES!!! 💖💍 Lets go a date now.");
  }

  function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random() * 3) + "s";
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 6000);
  }

  setInterval(createHeart, 300);
</script>

</body>
</html>
