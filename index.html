<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Valentine ❤️</title>
  <style>
    body {
      background: #ffe6eb;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
    }
    h1 {
      color: #e6005c;
      font-size: 3em;
    }
    p {
      font-size: 1.5em;
      color: #444;
    }
    button {
      margin-top: 30px;
      padding: 15px 30px;
      font-size: 1.2em;
      background: #e6005c;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Happy Valentine’s Day ❤️</h1>
  <p>Every day with you is my favorite story.</p>

  <button onclick="showLove()">Click for a surprise 💝</button>

  <script>
    function showLove() {
      alert("Will you be my Valentine… today and forever? 💍❤️");
    }
  </script>

</body>
</html>
