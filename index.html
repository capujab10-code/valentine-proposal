<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ajit & Puja ❤️</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      text-align: center;
      color: #fff;
    }

    .container {
      position: relative;
      top: 50%;
      transform: translateY(-50%);
      padding: 20px;
      z-index: 2;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.5em;
      margin-bottom: 30px;
    }

    button {
      padding: 15px 35px;
      font-size: 1.2em;
      background: #e6005c;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.1);
    }

    .hidden {
      display: none;
    }

    .heart, .firework {
      position: absolute;
      pointer-events: none;
    }

    .heart {
      color: rgba(255, 255, 255, 0.8);
      font-size: 20px;
      animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh);
        opacity: 1;
      }
      to {
        transform: translateY(-10vh);
        opacity: 0;
      }
    }

    .firework {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: white;
      animation: explode 1s ease-out forwards;
    }

    @keyframes explode {
      from {
        transform: scale(1);
        opacity: 1;
      }
      to {
        transform: scale(20);
        opacity: 0;
      }
    }

    #celebrationText {
      font-size: 2.2em;
      margin-top: 20px;
      animation: pop 0.6s ease-in-out infinite alternate;
    }

    @keyframes pop {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }
  </style>
</head>
<body>

<div class="container" id="intro">
  <h1>Happy Valentine’s Day Budu ❤️</h1>
  <p>Every love story is beautiful. But ours is my favorite.</p>
  <button onclick="showProposal()">Click here 💖</button>
</div>

<div class="container hidden" id="proposal">
  <h1>Ajit ❤️ Puja</h1>
  <p>
    From sunrise to sunset,<br>
    from dreams to forever…<br><br>
    <strong>Puja chooses Ajit.</strong><br>
    Today. Tomorrow. Always.
  </p>
  <h1>Will you be my Valentine forever? 💍❤️</h1>
  <button onclick="celebrate()">YES 😭❤️</button>
  <div id="celebrationText" class="hidden">
    Yayyyy, thank you for choosing me 💖
  </div>
</div>

<script>
  function showProposal() {
    document.getElementById("intro").classList.add("hidden");
    document.getElementById("proposal").classList.remove("hidden");
  }

  function celebrate() {
    document.getElementById("celebrationText").classList.remove("hidden");
    for (let i = 0; i < 25; i++) {
      setTimeout(createFirework, i * 120);
    }
  }

  function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random() * 3) + "s";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 6000);
  }

  function createFirework() {
    const firework = document.createElement("div");
    firework.className = "firework";
    firework.style.left = Math.random() * 100 + "vw";
    firework.style.top = Math.random() * 60 + "vh";
    firework.style.background =
      `hsl(${Math.random() * 360}, 100%, 70%)`;
    document.body.appendChild(firework);

    setTimeout(() => firework.remove(), 1000);
  }

  setInterval(createHeart, 300);
</script>

</body>
</html>
